openapi: 3.0.3
info:
  title: Requerial
  version: 0.1.0
  description: |
    API de Tarefas e Sessões de Trabalho do Requerial.
    Operações sobre uma sessão exigem o token entregue na criação dela.
paths:
  /tarefas:
    get:
      operationId: listarTarefas
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/StatusTarefa' }
        - name: organizacao
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Tarefas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Tarefa' }
    post:
      operationId: criarTarefa
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NovaTarefa' }
      responses:
        '201':
          description: Tarefa criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tarefa' }
        '400': { $ref: '#/components/responses/Erro' }
  /tarefas/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: obterTarefa
      responses:
        '200':
          description: Tarefa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tarefa' }
        '404': { $ref: '#/components/responses/Erro' }
    patch:
      operationId: alterarTarefa
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlteracaoTarefa' }
      responses:
        '200':
          description: Tarefa alterada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tarefa' }
        '400': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }
  /tarefas/{id}/lancamento:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: lancarAgente
      description: |
        Põe a tarefa em andamento e sobe um agente para ela, com instrução adicional de reabertura,
        modelo e esforço opcionais. Exige o lançador de agentes configurado e a tarefa sem sessão ativa.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PedidoDeLancamento' }
      responses:
        '200':
          description: Tarefa em andamento; o agente está subindo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tarefa' }
        '400': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }
        '409': { $ref: '#/components/responses/Erro' }
  /origens:
    get:
      operationId: listarOrigens
      responses:
        '200':
          description: Origens, por nome
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Origem' }
    post:
      operationId: criarOrigem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NovaOrigem' }
      responses:
        '201':
          description: Origem criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Origem' }
        '400': { $ref: '#/components/responses/Erro' }
        '409': { $ref: '#/components/responses/Erro' }
  /origens/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: obterOrigem
      responses:
        '200':
          description: Origem
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Origem' }
        '404': { $ref: '#/components/responses/Erro' }
    patch:
      operationId: alterarOrigem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlteracaoOrigem' }
      responses:
        '200':
          description: Origem alterada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Origem' }
        '400': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }
        '409': { $ref: '#/components/responses/Erro' }
  /requisitos:
    get:
      operationId: listarRequisitos
      description: Todos os requisitos, com as ligações (origem, cadeia e tarefas) em identificadores.
      parameters:
        - name: organizacao
          in: query
          schema: { type: string }
        - name: origem
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Requisitos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Requisito' }
    post:
      operationId: criarRequisito
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NovoRequisito' }
      responses:
        '201':
          description: Requisito criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Requisito' }
        '400': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }
  /requisitos/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: obterRequisito
      responses:
        '200':
          description: Requisito
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Requisito' }
        '404': { $ref: '#/components/responses/Erro' }
    patch:
      operationId: alterarRequisito
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlteracaoRequisito' }
      responses:
        '200':
          description: Requisito alterado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Requisito' }
        '400': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }
  /requisitos/{id}/derivacoes:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: derivarRequisito
      description: Registra que o requisito deriva de outro. Recusa ciclos.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Derivacao' }
      responses:
        '200':
          description: Requisito com a derivação
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Requisito' }
        '400': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }
        '409': { $ref: '#/components/responses/Erro' }
  /requisitos/{id}/derivacoes/{pai}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - name: pai
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: desfazerDerivacao
      description: Recusa deixar o requisito sem pai (só o zero não deriva de nenhum).
      responses:
        '200':
          description: Requisito sem a derivação
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Requisito' }
        '404': { $ref: '#/components/responses/Erro' }
  /requisitos/{id}/execucoes:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: listarExecucoes
      description: Execuções (verificações de conformidade) do requisito, da mais recente para a mais antiga.
      responses:
        '200':
          description: Execuções
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Execucao' }
        '404': { $ref: '#/components/responses/Erro' }
    post:
      operationId: registrarExecucao
      description: Registra que o requisito foi verificado e está conforme, com a evidência e o prazo de validade.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NovaExecucao' }
      responses:
        '201':
          description: Execução registrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Execucao' }
        '400': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }
  /templates:
    get:
      operationId: listarTemplates
      description: Templates de tarefa, com a última instância e se estão devidos agora.
      responses:
        '200':
          description: Templates
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Template' }
    post:
      operationId: criarTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NovoTemplate' }
      responses:
        '201':
          description: Template criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }
        '400': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }
  /templates/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: obterTemplate
      responses:
        '200':
          description: Template
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }
        '404': { $ref: '#/components/responses/Erro' }
    patch:
      operationId: alterarTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlteracaoTemplate' }
      responses:
        '200':
          description: Template alterado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }
        '400': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }
  /templates/{id}/instancias:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: instanciarTemplate
      description: Cria uma tarefa a partir do template (a fazer), ligada aos mesmos requisitos.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PedidoDeInstancia' }
      responses:
        '201':
          description: Tarefa criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tarefa' }
        '400': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }
  /organizacoes:
    get:
      operationId: listarOrganizacoes
      description: Organizações em uso (tarefas, requisitos, templates) e o zero de cada uma.
      responses:
        '200':
          description: Organizações
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Organizacao' }
  /organizacoes/{nome}:
    parameters:
      - name: nome
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: definirOrganizacao
      description: Atribui o zero da organização (um requisito dela).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DefinicaoDeOrganizacao' }
      responses:
        '200':
          description: Organização
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organizacao' }
        '400': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }
  /tarefas/{id}/requisitos:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: vincularRequisito
      description: Registra que a tarefa tenta atender o requisito.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VinculoRequisito' }
      responses:
        '200':
          description: Tarefa com o vínculo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tarefa' }
        '404': { $ref: '#/components/responses/Erro' }
  /tarefas/{id}/requisitos/{requisito}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - name: requisito
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: desvincularRequisito
      responses:
        '200':
          description: Tarefa sem o vínculo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tarefa' }
        '404': { $ref: '#/components/responses/Erro' }
  /lancador:
    get:
      operationId: opcoesDoLancador
      description: Modelos e esforços que o lançador de agentes aceita. 404 se não há lançador.
      responses:
        '200':
          description: Opções
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpcoesDeLancamento' }
        '404': { $ref: '#/components/responses/Erro' }
  /tarefas/{id}/sessoes:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: listarSessoesDaTarefa
      description: Histórico de sessões que trabalharam na tarefa, da mais recente para a mais antiga.
      responses:
        '200':
          description: Sessões
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Sessao' }
        '404': { $ref: '#/components/responses/Erro' }
  /sessoes:
    get:
      operationId: listarSessoes
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/StatusSessao' }
      responses:
        '200':
          description: Sessões
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Sessao' }
    post:
      operationId: criarSessao
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NovaSessao' }
      responses:
        '201':
          description: Sessão criada; o token só é entregue aqui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessaoCriada' }
        '400': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }
        '409': { $ref: '#/components/responses/Erro' }
  /sessoes/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: obterSessao
      responses:
        '200':
          description: Sessão
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sessao' }
        '404': { $ref: '#/components/responses/Erro' }
    patch:
      operationId: alterarSessao
      description: Atualiza os localizadores do journal e dos artefatos. O agente não pode ser alterado.
      security:
        - tokenDaSessao: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlteracaoSessao' }
      responses:
        '200':
          description: Sessão alterada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sessao' }
        '401': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }
        '409': { $ref: '#/components/responses/Erro' }
  /sessoes/{id}/tarefas:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: vincularTarefa
      security:
        - tokenDaSessao: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Vinculo' }
      responses:
        '200':
          description: Tarefa vinculada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sessao' }
        '401': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }
        '409': { $ref: '#/components/responses/Erro' }
  /sessoes/{id}/encerramento:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: encerrarSessao
      description: Encerra a sessão, libera as tarefas e grava o resumo em cada uma delas.
      security:
        - tokenDaSessao: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Encerramento' }
      responses:
        '200':
          description: Sessão encerrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sessao' }
        '400': { $ref: '#/components/responses/Erro' }
        '401': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }
        '409': { $ref: '#/components/responses/Erro' }
  /sessoes/{id}/encerramento-manual:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: encerrarSessaoManualmente
      description: |
        Encerramento feito por um humano (pelo frontend), sem o token da sessão, para quando o agente
        não está mais vivo para encerrar. Grava o resumo como no encerramento normal.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Encerramento' }
      responses:
        '200':
          description: Sessão encerrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sessao' }
        '400': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }
        '409': { $ref: '#/components/responses/Erro' }
  /sessoes/{id}/repasse:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: repassarSessao
      description: |
        Troca de agente. Encerra a sessão como substituída e cria outra, com `anterior` apontando
        para ela e as mesmas tarefas, numa única operação.
      security:
        - tokenDaSessao: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Repasse' }
      responses:
        '201':
          description: Nova sessão; o token só é entregue aqui
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessaoCriada' }
        '400': { $ref: '#/components/responses/Erro' }
        '401': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }
        '409': { $ref: '#/components/responses/Erro' }
  /importacao:
    post:
      operationId: importarTarefa
      description: |
        Importa uma tarefa já existente fora do Requerial, com as datas originais e as sessões que
        trabalharam nela, todas já encerradas. Os eventos registram o momento real da importação.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportacaoTarefa' }
      responses:
        '201':
          description: Tarefa importada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tarefa' }
        '400': { $ref: '#/components/responses/Erro' }
  /eventos:
    get:
      operationId: listarEventos
      parameters:
        - name: entidade
          in: query
          description: Identificador da entidade, como T-0001 ou S-0001
          schema: { type: string }
      responses:
        '200':
          description: Eventos, do mais antigo para o mais recente
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Evento' }
components:
  securitySchemes:
    tokenDaSessao:
      type: http
      scheme: bearer
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
  responses:
    Erro:
      description: Erro
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
  schemas:
    Erro:
      type: object
      required: [mensagem]
      properties:
        mensagem: { type: string }
    StatusTarefa:
      type: string
      enum: [a_fazer, em_andamento, pausada, bloqueada, em_validacao, concluida]
    StatusSessao:
      type: string
      enum: [ativa, encerrada, substituida]
    TipoAgente:
      type: string
      enum: [ia, humano]
    MotivoEncerramento:
      type: string
      enum: [fim_do_trabalho, troca_de_agente]
    Tarefa:
      type: object
      required: [id, titulo, descricao, organizacao, status, resumo, criada_em, atualizada_em]
      properties:
        id: { type: string, example: T-0001 }
        titulo: { type: string }
        descricao: { type: string }
        organizacao: { type: string }
        status: { $ref: '#/components/schemas/StatusTarefa' }
        resumo:
          type: string
          description: Estado para retomar, gravado no encerramento de cada sessão
        sessao_ativa: { type: string, example: S-0001 }
        template: { type: string, example: TP-0001, description: 'Template do qual a tarefa foi instanciada' }
        requisitos:
          type: array
          description: Requisitos que a tarefa tenta atender (só na leitura de uma tarefa)
          items: { type: string }
        criada_em: { type: string, format: date-time }
        atualizada_em: { type: string, format: date-time }
    Template:
      type: object
      description: |
        Tarefa que sempre precisa ser executada, sob demanda (sem periodicidade) ou periódica. Nada é
        instanciado automaticamente: periódico com a última instância mais antiga que a periodicidade
        (ou nunca instanciado), e sem instância aberta, está devido.
      required: [id, titulo, descricao, organizacao, requisitos, instancias, devido, criado_em, atualizado_em]
      properties:
        id: { type: string, example: TP-0001 }
        titulo: { type: string }
        descricao: { type: string, description: 'Instruções; vira a descrição de cada instância' }
        organizacao: { type: string }
        periodicidade_dias: { type: integer, description: 'Sem ele, sob demanda' }
        requisitos:
          type: array
          description: Requisitos aos quais cada instância é ligada
          items: { type: string }
        instancias:
          type: array
          description: Tarefas instanciadas, da mais recente para a mais antiga
          items: { type: string }
        ultima_instancia_em: { type: string, format: date-time }
        instancia_aberta: { type: string, description: 'Instância ainda não concluída, se houver' }
        proxima_em: { type: string, format: date-time, description: 'Quando a próxima instância é devida (periódicos)' }
        devido: { type: boolean }
        criado_em: { type: string, format: date-time }
        atualizado_em: { type: string, format: date-time }
    NovoTemplate:
      type: object
      required: [titulo, organizacao]
      properties:
        titulo: { type: string }
        descricao: { type: string }
        organizacao: { type: string }
        periodicidade_dias: { type: integer, minimum: 1 }
        requisitos:
          type: array
          items: { type: string }
    AlteracaoTemplate:
      type: object
      properties:
        titulo: { type: string }
        descricao: { type: string }
        organizacao: { type: string }
        periodicidade_dias: { type: integer, minimum: 0, description: '0 torna sob demanda' }
        requisitos:
          type: array
          description: Substitui a lista inteira
          items: { type: string }
    PedidoDeInstancia:
      type: object
      properties:
        titulo: { type: string, description: 'Padrão: o título do template com a data' }
    Organizacao:
      type: object
      required: [nome]
      properties:
        nome: { type: string }
        zero: { type: string, example: R-0002, description: 'Requisito do qual todos os outros da organização derivam' }
    DefinicaoDeOrganizacao:
      type: object
      required: [zero]
      properties:
        zero: { type: string }
    NovaTarefa:
      type: object
      required: [titulo, organizacao]
      properties:
        titulo: { type: string }
        descricao: { type: string }
        organizacao: { type: string }
        status: { $ref: '#/components/schemas/StatusTarefa' }
    AlteracaoTarefa:
      type: object
      properties:
        titulo: { type: string }
        descricao: { type: string }
        organizacao: { type: string }
        status: { $ref: '#/components/schemas/StatusTarefa' }
        resumo: { type: string }
    Origem:
      type: object
      required: [id, nome, tipo, descricao, criada_em]
      properties:
        id: { type: string, example: O-0001 }
        nome: { type: string, description: 'Pessoa (quem pede) ou documento (lei, norma, contrato)' }
        tipo: { $ref: '#/components/schemas/TipoOrigem' }
        descricao: { type: string }
        criada_em: { type: string, format: date-time }
    TipoOrigem:
      type: string
      enum: [pessoa, documento]
    NovaOrigem:
      type: object
      required: [nome, tipo]
      properties:
        nome: { type: string }
        tipo: { $ref: '#/components/schemas/TipoOrigem' }
        descricao: { type: string }
    AlteracaoOrigem:
      type: object
      properties:
        nome: { type: string }
        tipo: { $ref: '#/components/schemas/TipoOrigem' }
        descricao: { type: string }
    Requisito:
      type: object
      required: [id, titulo, descricao, organizacao, deriva_de, derivados, tarefas, atencao, estado, estado_proprio, limitado_por, tarefas_abertas, criado_em, atualizado_em]
      properties:
        id: { type: string, example: R-0001 }
        titulo: { type: string }
        descricao: { type: string }
        organizacao: { type: string }
        origem: { type: string, example: O-0001 }
        deriva_de:
          type: array
          description: Requisitos dos quais este deriva (acima na cadeia)
          items: { type: string }
        derivados:
          type: array
          description: Requisitos que derivam deste (abaixo na cadeia)
          items: { type: string }
        tarefas:
          type: array
          description: Tarefas que tentam atender este requisito
          items: { type: string }
        atencao:
          type: array
          description: Motivos pelos quais o requisito não está bem cuidado (vazio se está)
          items: { $ref: '#/components/schemas/Atencao' }
        estado: { $ref: '#/components/schemas/EstadoDoRequisito' }
        prioridade: { $ref: '#/components/schemas/Prioridade' }
        estado_proprio: { $ref: '#/components/schemas/EstadoDoRequisito' }
        limitado_por:
          type: array
          description: Requisitos logo abaixo que limitam o estado dele a um menos maduro que o próprio
          items: { type: string }
        tarefas_abertas:
          type: array
          description: Tarefas ligadas a este requisito que não estão concluídas
          items: { type: string }
        ultima_execucao: { $ref: '#/components/schemas/Execucao' }
        criado_em: { type: string, format: date-time }
        atualizado_em: { type: string, format: date-time }
    Prioridade:
      type: string
      description: Escolhida na triagem; ausente, o requisito ainda não foi triado.
      enum: [alta, media, baixa]
    EstadoDoRequisito:
      type: string
      description: |
        Calculado, nunca escrito à mão. Do menos ao mais maduro: nao_atendido (tarefa aberta fora de
        andamento, ou nem tarefa nem execução), em_trabalho (tarefa em andamento), nao_validado
        (tarefas todas concluídas, sem execução),
        validacao_expirada (a última execução passou do prazo), validado. O estado próprio vem das
        tarefas ligadas e da última execução; o estado é o menos maduro entre o próprio e o de cada
        requisito abaixo. Sem tarefa e sem execução, um requisito com derivados é decidido só por eles.
      enum: [nao_atendido, em_trabalho, nao_validado, validacao_expirada, validado]
    Execucao:
      type: object
      required: [id, requisito, evidencia, realizada_em, autor, registrada_em]
      properties:
        id: { type: string, example: E-0001 }
        requisito: { type: string, example: R-0001 }
        evidencia: { type: string, description: 'O que foi verificado e como (comando, relatório, link)' }
        realizada_em: { type: string, format: date-time }
        valida_ate: { type: string, format: date-time, description: 'Sem prazo, não expira' }
        autor: { type: string }
        registrada_em: { type: string, format: date-time }
    NovaExecucao:
      type: object
      required: [evidencia]
      properties:
        evidencia: { type: string }
        realizada_em: { type: string, format: date-time, description: 'Padrão: agora' }
        validade_dias: { type: integer, minimum: 1, description: 'Dias a partir de realizada_em; sem ele, não expira' }
    Atencao:
      type: object
      required: [motivo, detalhe]
      properties:
        motivo: { $ref: '#/components/schemas/MotivoDeAtencao' }
        detalhe: { type: string }
    MotivoDeAtencao:
      type: string
      enum: [muitos_filhos, sem_origem, sem_descricao, sem_tarefa, trabalho_parado, outra_organizacao]
    NovoRequisito:
      type: object
      required: [titulo]
      properties:
        titulo: { type: string }
        descricao: { type: string }
        organizacao: { type: string, description: 'Padrão: a do primeiro requisito em deriva_de' }
        origem: { type: string }
        deriva_de:
          type: array
          description: 'Padrão: o requisito zero (o único sem pais; o primeiro requisito criado é ele)'
          items: { type: string }
    AlteracaoRequisito:
      type: object
      properties:
        titulo: { type: string }
        descricao: { type: string }
        organizacao: { type: string }
        origem: { type: string, description: 'Vazio remove a origem' }
        prioridade: { type: string, description: 'alta, media ou baixa; vazio volta a não triado' }
    Derivacao:
      type: object
      required: [pai]
      properties:
        pai: { type: string, description: Requisito do qual este deriva }
    VinculoRequisito:
      type: object
      required: [requisito]
      properties:
        requisito: { type: string }
    PedidoDeLancamento:
      type: object
      properties:
        instrucao: { type: string, description: 'Instrução adicional de reabertura, somada ao prompt padrão; o resto do contexto o agente lê da tarefa e das sessões anteriores' }
        modelo: { type: string, description: 'Um dos modelos do lançador; padrão: o primeiro' }
        esforco: { type: string, description: 'Um dos esforços do lançador; padrão: o configurado' }
    OpcoesDeLancamento:
      type: object
      required: [modelos, esforcos, modelo_padrao]
      properties:
        modelos:
          type: array
          items: { type: string }
        esforcos:
          type: array
          items: { type: string }
        modelo_padrao: { type: string }
        esforco_padrao: { type: string }
    Sessao:
      type: object
      required: [id, status, agente, tipo_agente, servidor, artefatos, tarefas, iniciada_em]
      properties:
        id: { type: string, example: S-0001 }
        status: { $ref: '#/components/schemas/StatusSessao' }
        agente:
          type: string
          description: Provider, modelo e esforço, ou o nome de um humano. Imutável.
          example: Claude Opus 5.5 Medium
        tipo_agente: { $ref: '#/components/schemas/TipoAgente' }
        chat: { type: string, description: Identificador do chat do agente }
        servidor: { type: string, description: Máquina onde a sessão roda }
        anterior: { type: string, example: S-0001 }
        motivo_encerramento: { $ref: '#/components/schemas/MotivoEncerramento' }
        journal: { type: string, description: 'Localizador: <maquina>:<caminho> ou github.com/<dono>/<repo>@<commit>:<caminho>' }
        artefatos:
          type: array
          items: { type: string }
        tarefas:
          type: array
          items: { type: string }
        iniciada_em: { type: string, format: date-time }
        encerrada_em: { type: string, format: date-time }
        resumo: { type: string, description: Resumo gravado no encerramento desta sessão }
    NovaSessao:
      type: object
      required: [agente, tipo_agente, servidor, tarefas]
      properties:
        agente: { type: string }
        tipo_agente: { $ref: '#/components/schemas/TipoAgente' }
        chat: { type: string }
        servidor: { type: string }
        journal: { type: string }
        tarefas:
          type: array
          items: { type: string }
    SessaoCriada:
      type: object
      required: [sessao, token]
      properties:
        sessao: { $ref: '#/components/schemas/Sessao' }
        token: { type: string }
    AlteracaoSessao:
      type: object
      properties:
        journal: { type: string }
        artefatos:
          type: array
          items: { type: string }
    Vinculo:
      type: object
      required: [tarefa]
      properties:
        tarefa: { type: string }
    Encerramento:
      type: object
      required: [resumo]
      properties:
        resumo: { type: string, description: Gravado como resumo de cada tarefa da sessão }
        journal: { type: string }
        artefatos:
          type: array
          items: { type: string }
    Repasse:
      type: object
      required: [agente, tipo_agente]
      properties:
        agente: { type: string }
        tipo_agente: { $ref: '#/components/schemas/TipoAgente' }
        chat: { type: string }
        servidor: { type: string, description: Se omitido, usa o da sessão anterior }
    ImportacaoTarefa:
      type: object
      required: [titulo, organizacao, status, criada_em, origem, sessoes]
      properties:
        titulo: { type: string }
        descricao: { type: string }
        organizacao: { type: string }
        status: { $ref: '#/components/schemas/StatusTarefa' }
        criada_em: { type: string, format: date-time }
        origem: { type: string, description: De onde a tarefa veio, para o log de eventos }
        sessoes:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/SessaoImportada' }
    SessaoImportada:
      type: object
      required: [agente, servidor, iniciada_em, encerrada_em, resumo]
      properties:
        agente: { type: string }
        servidor: { type: string }
        journal: { type: string }
        iniciada_em: { type: string, format: date-time }
        encerrada_em: { type: string, format: date-time }
        resumo: { type: string }
    Evento:
      type: object
      required: [id, momento, autor, entidade, tipo, dados]
      properties:
        id: { type: integer, format: int64 }
        momento: { type: string, format: date-time }
        autor: { type: string }
        entidade: { type: string }
        tipo: { type: string }
        dados:
          type: object
          additionalProperties: true
